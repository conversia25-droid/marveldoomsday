function CosmicField() {
  const [y, setY] = useState(0);
  useEffect(() => {
    let raf = null;
    const onScroll = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { setY(window.scrollY || 0); raf = null; });
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => { window.removeEventListener("scroll", onScroll); if (raf) cancelAnimationFrame(raf); };
  }, []);
  return (
    <div aria-hidden style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 0 }}>
      {COSMOS.map((o, i) => (
        <div key={i} style={{
          position: "absolute", top: o.top,
          [o.side === "l" ? "left" : "right"]: o.off,
          transform: `translateY(${-y * o.par}px)`,
          willChange: "transform",
          opacity: o.k === "nebula" ? 0.75 : 0.6,
        }}>
          <CosmicObject k={o.k} size={o.size} hue={o.hue} ring={o.ring} />
        </div>
      ))}
    </div>
  );
}

/* ---------- pôsteres TMDB (opcionais) ---------- */
const posterCache = (() => { try { return JSON.parse(localStorage.getItem("rd_posters") || "{}"); } catch { return {}; } })();
function savePosterCache() { try { localStorage.setItem("rd_posters", JSON.stringify(posterCache)); } catch {} }

async function loadPosterManifest() {
  if (!POSTER_MANIFEST_URL) return false;
  try {
    const r = await fetch(POSTER_MANIFEST_URL, { cache: "no-store" });
    if (!r.ok) return false;
    const data = await r.json();
    const map = data && data.posters ? data.posters : data;
    if (!map || typeof map !== "object") return false;
    let changed = false;
    Object.keys(map).forEach((id) => {
      if (map[id] && posterCache[id] !== map[id]) {
        posterCache[id] = map[id];
        changed = true;
      }
    });
    if (changed) savePosterCache();
    return changed;
  } catch { return false; }
}

async function fetchPoster(it) {
  if (!TMDB_TOKEN) return null;
  if (posterCache[it.id] !== undefined) return posterCache[it.id];
  try {
    const kind = it.tv ? "tv" : "movie";
    const yparam = it.tv ? `first_air_date_year=${it.y}` : `primary_release_year=${it.y}`;
    const url = `https://api.themoviedb.org/3/search/${kind}?query=${encodeURIComponent(it.q || it.t)}&${yparam}&language=pt-BR&page=1`;
    const r = await fetch(url, { headers: { Authorization: `Bearer ${TMDB_TOKEN}` } });
    const j = await r.json();
    const p = j.results && j.results[0] && j.results[0].poster_path ? j.results[0].poster_path : null;
    posterCache[it.id] = p; savePosterCache();
    return p;
  } catch { return null; }
}

function createRouteClient() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase || !window.supabase.createClient) return null;
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true, flowType: "pkce" },
  });
}

function cleanAuthUrl() {
  const url = new URL(window.location.href);
  const authHash = /access_token|refresh_token|provider_token|expires_at|token_type/.test(url.hash);
  const authSearch = ["code", "error", "error_code", "error_description"].some((key) => url.searchParams.has(key));
  if (!authHash && !authSearch) return;

  if (authHash) url.hash = "";
  ["code", "error", "error_code", "error_description"].forEach((key) => url.searchParams.delete(key));

  const cleanPath = `${url.pathname}${url.search}${url.hash}`;
  window.history.replaceState({}, document.title, cleanPath || "/");
}

async function readInitialSession(client) {
  const url = new URL(window.location.href);
  const authCode = url.searchParams.get("code");

  if (authCode && client.auth.exchangeCodeForSession) {
    const { data, error } = await client.auth.exchangeCodeForSession(authCode);
    cleanAuthUrl();
    if (error) throw error;
    return data.session || null;
  }

  const { data, error } = await client.auth.getSession();
  cleanAuthUrl();
  if (error) throw error;
  return data.session || null;
}

function rowsToBranches(branchRows, movieRows) {
  const byId = {};
  branchRows.forEach((row) => {
    byId[row.id] = {
      id: row.id,
      color: row.color || C.extra,
      emblem: row.emblem || "m",
      dashed: !!row.dashed,
      title: row.title,
      sub: row.subtitle || "",
      merge: row.merge_text || "",
      items: [],
    };
  });
  movieRows.forEach((row) => {
    const branch = byId[row.branch_id];
    if (!branch) return;
    branch.items.push({
      id: row.id,
      t: row.title,
      q: row.search_query || row.title,
      y: row.release_year,
      cy: Number(row.story_year || row.release_year || 0),
      tv: row.media_type === "tv" ? 1 : 0,
      m: row.importance || M.C,
      note: row.note || "",
      w: row.why || "",
    });
    if (row.poster_path) posterCache[row.id] = row.poster_path;
  });
  return Object.values(byId).filter((branch) => branch.items.length);
}

async function loadRouteFromSupabase(client) {
  const { data: branchRows, error: branchError } = await client
    .from("branches")
    .select("*")
    .order("display_order", { ascending: true });
  if (branchError) throw branchError;

  const { data: movieRows, error: movieError } = await client
    .from("movies")
    .select("*")
    .eq("active", true)
    .order("branch_id", { ascending: true })
    .order("display_order", { ascending: true });
  if (movieError) throw movieError;

  return rowsToBranches(branchRows || [], movieRows || []);
}

function onlyDigits(value) {
  return String(value || "").replace(/\D/g, "");
}

function formatCpfCnpj(value) {
  const digits = onlyDigits(value).slice(0, 14);
  if (digits.length <= 11) {
    return digits
      .replace(/(\d{3})(\d)/, "$1.$2")
      .replace(/(\d{3})(\d)/, "$1.$2")
      .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  }
  return digits
    .replace(/(\d{2})(\d)/, "$1.$2")
    .replace(/(\d{3})(\d)/, "$1.$2")
    .replace(/(\d{3})(\d)/, "$1/$2")
    .replace(/(\d{4})(\d{1,2})$/, "$1-$2");
}

function isPwaStandalone() {
  return window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function isIosDevice() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent || "");
}

function isIosSafariBrowser() {
  const ua = window.navigator.userAgent || "";
  const vendor = window.navigator.vendor || "";
  return isIosDevice()
    && /safari/i.test(ua)
    && /apple/i.test(vendor)
    && !/(crios|fxios|edgios|opios|instagram|fbav|fban|line|twitter|whatsapp|linkedin)/i.test(ua);
}

function PwaInstallModal({ canInstall, onInstall, onContinue, onClose }) {
  const [linkMessage, setLinkMessage] = useState("");
  const ios = isIosDevice();
  const iosSafari = isIosSafariBrowser();
  const iosNeedsSafari = ios && !iosSafari;
  const canUseNativeInstall = canInstall && !ios;
  const viewportWidth = Math.floor(Math.min(...[
    window.visualViewport?.width,
    window.innerWidth,
    window.outerWidth,
    window.screen?.width,
  ].filter((value) => Number.isFinite(value) && value > 0)));
  const modalWidth = Math.min(430, Math.max(280, viewportWidth - 32));
  const compactActions = modalWidth < 390;
  const installUrl = getCleanAppUrl();

  const copyInstallLink = async () => {
    try {
      if (!navigator.clipboard?.writeText) throw new Error("clipboard unavailable");
      await navigator.clipboard.writeText(installUrl);
      setLinkMessage("Link copiado. Cole no Safari e adicione à Tela de Início.");
    } catch (_) {
      window.prompt("Copie este link e abra no Safari:", installUrl);

  const [profileUploading, setProfileUploading] = useState(false);
  const [purchaseOpen, setPurchaseOpen] = useState(false);
  const [purchaseForm, setPurchaseForm] = useState({ name: "", cpfCnpj: "" });

  const [purchaseLoading, setPurchaseLoading] = useState(false);
  const [pixPayment, setPixPayment] = useState(null);
  const [installPrompt, setInstallPrompt] = useState(null);
  const [canInstallPwa, setCanInstallPwa] = useState(false);
  const [pwaInstalled, setPwaInstalled] = useState(() => isPwaStandalone());
  const [pwaNudgeOpen, setPwaNudgeOpen] = useState(false);
  const [pwaNudgeDismissed, setPwaNudgeDismissed] = useState(() => {
    try { return sessionStorage.getItem(PWA_NUDGE_SESSION_KEY) === "1"; } catch { return false; }
  });
  const [watched, setWatched] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("rd_watched") || "[]")); } catch { return new Set(); }
  });
  const [filter, setFilter] = useState(() => localStorage.getItem("rd_filter") || "recomendado");
  const [view, setView] = useState(() => localStorage.getItem("rd_view") || "arvore");
  const [posters, setPosters] = useState({ ...posterCache });
  const [posterPreview, setPosterPreview] = useState(null);
  const [open, setOpen] = useState(() => { const o = {}; BRANCHES.forEach((b) => (o[b.id] = true)); return o; });
  const [expanded, setExpanded] = useState(null);
  const toggleExpand = (id) => setExpanded((e) => (e === id ? null : id));
  const sectionRefs = useRef({});
  const premiumPromptedRef = useRef("");
  const progressLocked = !!routeClient && (!session || !profile?.premium_lifetime);

  function seedPurchaseForm(sourceProfile = profile) {
    if (!session) return;
    const fallback = profileFromSession(session);
    setPurchaseForm({
      name: sourceProfile?.display_name || fallback.display_name || session.user.email || "",
      cpfCnpj: "",
    });
    setPixPayment(null);
  }

  function requestPremiumCheckout(message = "") {
    if (!routeClient) return true;
    if (!session) {
      setGuestMode(false);
      setAuthMessage(`Entre primeiro para liberar as marcações com acesso vitalício ${LIFETIME_PRICE_LABEL}.`);
      return false;
    }
    if (profile?.premium_lifetime) return true;
    seedPurchaseForm(profile);
    setPurchaseMessage(message || `Para marcar filmes e salvar progresso, ative o acesso vitalício ${LIFETIME_PRICE_LABEL} no Pix.`);
    setPurchaseOpen(true);
    return false;
  }

  useEffect(() => { localStorage.setItem("rd_filter", filter); }, [filter]);
  useEffect(() => { localStorage.setItem("rd_view", view); }, [view]);
  useEffect(() => {
    setOpen((current) => {
      const next = { ...current };
      routeBranches.forEach((b) => { if (next[b.id] === undefined) next[b.id] = true; });
      return next;
    });
  }, [routeBranches]);
  useEffect(() => {
    if (!posterPreview) return;
    const onKey = (e) => { if (e.key === "Escape") setPosterPreview(null); };
    const oldOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.addEventListener("keydown", onKey);
    return () => {
      document.body.style.overflow = oldOverflow;
      document.removeEventListener("keydown", onKey);
    };
  }, [posterPreview]);

  useEffect(() => {
    const onBeforeInstallPrompt = (event) => {
      event.preventDefault();
      setInstallPrompt(event);
      setCanInstallPwa(true);
    };
    const onAppInstalled = () => {
      setInstallPrompt(null);
      setCanInstallPwa(false);
      setPwaInstalled(true);
      setPwaNudgeOpen(false);
      setPwaNudgeDismissed(true);
      try { sessionStorage.setItem(PWA_NUDGE_SESSION_KEY, "1"); } catch (_) {}
    };
    window.addEventListener("beforeinstallprompt", onBeforeInstallPrompt);
    window.addEventListener("appinstalled", onAppInstalled);
    return () => {
      window.removeEventListener("beforeinstallprompt", onBeforeInstallPrompt);
      window.removeEventListener("appinstalled", onAppInstalled);
    };
  }, []);

  useEffect(() => {
    if (isPwaStandalone()) {
      setPwaInstalled(true);
      return;
    }
    if (pwaInstalled || pwaNudgeDismissed || pwaNudgeOpen || purchaseOpen || profileOpen || posterPreview) return;
    const timer = setTimeout(() => setPwaNudgeOpen(true), 900);
    return () => clearTimeout(timer);
  }, [
    pwaInstalled,
    pwaNudgeDismissed,
    pwaNudgeOpen,
    purchaseOpen,
    profileOpen,
    posterPreview,
  ]);

  useEffect(() => {
    if (!routeClient || !session) {
      setProfile(null);
      setProfileOpen(false);
      setProfileMessage("");
      setProfileUploading(false);
      setPurchaseOpen(false);
      setPurchaseMessage("");
      setPixPayment(null);
      premiumPromptedRef.current = "";
      setProfileForm(profileToForm(null, session));
      return;
    }

    let alive = true;
    (async () => {
      const fallback = profileFromSession(session);
      const { data, error } = await routeClient
        .from("profiles")
        .select(PROFILE_SELECT)
        .eq("id", session.user.id)
        .maybeSingle();

      if (!alive) return;
      const next = error ? fallback : { ...fallback, ...(data || {}) };
      setProfile(next);
      setProfileForm(profileToForm(next, session));
      if (!next.premium_lifetime && premiumPromptedRef.current !== session.user.id) {
        premiumPromptedRef.current = session.user.id;
        seedPurchaseForm(next);
        setPurchaseMessage(`Para salvar seu progresso, ative o acesso vitalício ${LIFETIME_PRICE_LABEL} no Pix.`);
        setPurchaseOpen(true);
      }
    })();

    return () => { alive = false; };
  }, [routeClient, session && session.user.id]);

  useEffect(() => {
    if (!routeClient) {
      setAuthReady(true);
      return;
    }
    let alive = true;

    readInitialSession(routeClient)
      .then((initialSession) => {
        if (!alive) return;
        setSession(initialSession || null);
        if (initialSession) setGuestMode(false);
        setAuthReady(true);
      })
      .catch((error) => {
        if (!alive) return;
        setAuthMessage(error.message || "Nao foi possivel concluir o login.");
        setAuthReady(true);
        cleanAuthUrl();
      });

    const { data } = routeClient.auth.onAuthStateChange((_event, nextSession) => {
      setSession(nextSession || null);
      if (nextSession) setGuestMode(false);
      setAuthReady(true);
      setAuthMessage("");
      if (nextSession) cleanAuthUrl();
    });

    return () => {
      alive = false;
      data.subscription.unsubscribe();
    };
  }, [routeClient]);

  useEffect(() => {
    if (!routeClient) return;
    let alive = true;

    const refreshRoute = async () => {
      setSyncState("carregando rota");
      try {
        const next = await loadRouteFromSupabase(routeClient);
        if (!alive) return;
        if (next.length) {
          setRouteBranches(next);
          setRouteSource("supabase");
          setPosters({ ...posterCache });
          setSyncState("rota online");
        } else {
          setRouteSource("local");
          setSyncState("rota local");
        }
      } catch {
        if (!alive) return;
        setRouteSource("local");
        setSyncState("rota local");
      }
    };

    refreshRoute();
    const channel = routeClient
      .channel("route-data")
      .on("postgres_changes", { event: "*", schema: "public", table: "branches" }, refreshRoute)
      .on("postgres_changes", { event: "*", schema: "public", table: "movies" }, refreshRoute)
      .subscribe();

    return () => {
      alive = false;
      routeClient.removeChannel(channel);
    };
  }, [routeClient]);

  /* pôsteres TMDB */
  useEffect(() => {
    let alive = true;
    (async () => {
      const loaded = await loadPosterManifest();
      if (alive && loaded) setPosters({ ...posterCache });
      if (!TMDB_TOKEN) return;
      const all = [];
      routeBranches.forEach((b) => b.items.forEach((it) => all.push(it)));
      for (const it of all) {
        if (!alive) return;
        if (posterCache[it.id] === undefined) await fetchPoster(it);
      }
      if (alive) setPosters({ ...posterCache });
    })();
    return () => { alive = false; };
  }, [routeBranches]);

  const persist = (set) => {
    try { localStorage.setItem("rd_watched", JSON.stringify([...set])); } catch (_) {}
  };

  useEffect(() => {
    if (!routeClient) return;
    if (!session) {
      setWatched(new Set());
      setSyncState(guestMode ? "premium para marcar" : "");
      return;
    }
    if (!profile) {
      setSyncState("verificando acesso");
      return;
    }
    if (!profile.premium_lifetime) {
      setWatched(new Set());
      setSyncState("premium para marcar");
      return;
    }

    let alive = true;
    (async () => {
      setSyncState("carregando progresso");
      const { data, error } = await routeClient
        .from("watch_progress")
        .select("movie_id")
        .eq("user_id", session.user.id);

      if (!alive) return;
      if (error) {
        setSyncState("progresso local");
        return;
      }

      const remote = new Set((data || []).map((row) => row.movie_id));
      const local = (() => { try { return new Set(JSON.parse(localStorage.getItem("rd_watched") || "[]")); } catch { return new Set(); } })();

      if (!remote.size && local.size) {
        const rows = [...local].map((movie_id) => ({ user_id: session.user.id, movie_id, watched: true }));
        await routeClient.from("watch_progress").upsert(rows, { onConflict: "user_id,movie_id" });
        if (!alive) return;
        setWatched(local);
      } else {
        setWatched(remote);
        persist(remote);
      }
      setSyncState("progresso online");
    })();

    return () => { alive = false; };
  }, [routeClient, session && session.user.id, profile?.premium_lifetime, guestMode]);

  const saveRemoteProgress = async (id, done) => {
    if (!routeClient || !session) return;
    if (!profile?.premium_lifetime) return;
    setSyncState("salvando");
    const request = done
      ? routeClient.from("watch_progress").upsert({
          user_id: session.user.id,
          movie_id: id,
          watched: true,
          updated_at: new Date().toISOString(),
        }, { onConflict: "user_id,movie_id" })
      : routeClient.from("watch_progress").delete().eq("user_id", session.user.id).eq("movie_id", id);
    const { error } = await request;
    setSyncState(error ? "falha ao salvar" : "salvo");
  };

  const toggle = (id) => {
    if (!requestPremiumCheckout(`Para marcar filmes e salvar progresso, ative o acesso vitalício ${LIFETIME_PRICE_LABEL} no Pix.`)) return;
    setWatched((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      persist(next);
      saveRemoteProgress(id, next.has(id));
      return next;
    });
  };

  const resetAll = async () => {
    if (!requestPremiumCheckout(`Para zerar e sincronizar progresso, ative o acesso vitalício ${LIFETIME_PRICE_LABEL} no Pix.`)) return;
    if (!confirm("Zerar todo o progresso?")) return;
    const n = new Set(); setWatched(n); persist(n);
    if (routeClient && session) {
      const { error } = await routeClient.from("watch_progress").delete().eq("user_id", session.user.id);
      setSyncState(error ? "falha ao zerar" : "progresso zerado");
    }
  };

  const signIn = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!routeClient) return;
    if (!authEmail.trim() || !authPassword) {
      setAuthMessage("Informe email e senha para entrar.");
      return;
    }
    setAuthMessage("");
    setAuthLoading(true);
    const { error } = await routeClient.auth.signInWithPassword({ email: authEmail.trim(), password: authPassword });
    if (!error) setGuestMode(false);
    setAuthMessage(error ? error.message : "Conectado");
    setAuthLoading(false);
  };

  const signUp = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!routeClient) return;
    if (!authEmail.trim() || !authPassword) {
      setAuthMessage("Informe email e senha para criar a conta.");
      return;
    }
    setAuthMessage("");
    setAuthLoading(true);
    const { error } = await routeClient.auth.signUp({ email: authEmail.trim(), password: authPassword });
    setAuthMessage(error ? error.message : "Conta criada; confira o email se pedir confirmacao");
    setAuthLoading(false);
  };

  const signInWithGoogle = async () => {
    if (!routeClient) return;
    setAuthMessage("");
    setAuthLoading(true);
    const redirectTo = `${window.location.origin}${window.location.pathname}`;
    const { error } = await routeClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo },
    });
    if (error) {
      setAuthMessage(error.message);
      setAuthLoading(false);
    }
  };

  const refreshProfile = async () => {
    if (!routeClient || !session) return null;
    const fallback = profileFromSession(session);
    const { data, error } = await routeClient
      .from("profiles")
      .select(PROFILE_SELECT)
      .eq("id", session.user.id)
      .maybeSingle();
    if (error) return null;
    const next = { ...fallback, ...(data || {}) };
    setProfile(next);
    setProfileForm(profileToForm(next, session));
    return next;

  const openPurchase = (message = "") => {

    if (!session) {
      setGuestMode(false);
      setAuthMessage(`Entre primeiro para vincular o acesso vitalício ${LIFETIME_PRICE_LABEL} a sua conta.`);
      return;
    }
    if (profile?.premium_lifetime) {
      setPurchaseMessage("Seu acesso premium vitalício ja esta ativo.");
      setPixPayment(null);
    } else {
      seedPurchaseForm(profile);
      setPurchaseMessage(message || "");
    }
    setPurchaseOpen(true);
  };

  const showLifetimeAccess = () => {
    openPurchase();
  };

  const changePurchaseField = (field, value) => {
    setPurchaseForm((current) => ({ ...current, [field]: value }));
    setPurchaseMessage("");
  };

  const createPixPayment = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!routeClient || !session) return;

    const cpfCnpj = onlyDigits(purchaseForm.cpfCnpj);
    if (!purchaseForm.name.trim()) {
      setPurchaseMessage("Informe o nome para a cobranca.");
      return;
    }
    if (![11, 14].includes(cpfCnpj.length)) {
      setPurchaseMessage("Informe um CPF ou CNPJ valido.");
      return;
    }

    setPurchaseLoading(true);
    setPurchaseMessage("Gerando Pix no Asaas...");
    const { data, error } = await routeClient.functions.invoke("asaas-create-pix", {
      body: { payerName: purchaseForm.name.trim(), cpfCnpj },
    });
    setPurchaseLoading(false);

    if (error || data?.error) {
      setPurchaseMessage(data?.error || error?.message || "Nao foi possivel gerar o Pix.");
      return;
    }

    if (data?.premium) {
      await refreshProfile();
      setPurchaseMessage("Seu acesso premium vitalício ja esta ativo.");
      return;
    }

    setPixPayment(data);
    setPurchaseMessage("Pix gerado. Pague pelo QR Code ou copia e cola.");
  };

  const copyPixPayload = async () => {
    const payload = pixPayment?.pix?.payload || "";
    if (!payload) return;
    try {
      await navigator.clipboard.writeText(payload);
      setPurchaseMessage("Pix copia e cola copiado.");
    } catch {
      setPurchaseMessage("Nao consegui copiar automaticamente. Selecione e copie o codigo Pix.");
    }
  };

  const checkPixPayment = async () => {
    if (!routeClient || !session || !pixPayment?.purchase_id) return;
    setPurchaseLoading(true);
    setPurchaseMessage("Verificando pagamento...");
    const { data, error } = await routeClient.functions.invoke("asaas-check-pix", {
      body: { purchaseId: pixPayment.purchase_id },
    });
    setPurchaseLoading(false);

    if (error || data?.error) {
      setPurchaseMessage(data?.error || error?.message || "Nao foi possivel verificar o pagamento.");
      return;
    }

    if (data?.paid || data?.premium) {
      await refreshProfile();
      setPurchaseMessage("Pagamento confirmado. Premium vitalício ativo.");
      return;
    }

    setPurchaseMessage(`Ainda nao recebemos o Pix. Status: ${data?.status || "pendente"}.`);
  };

  const changeProfileField = (field, value) => {
    setProfileForm((current) => ({ ...current, [field]: value }));
    setProfileMessage("");
  };

  const openProfile = () => {
    setProfileForm(profileToForm(profile, session));
    setProfileMessage("");
    setProfileOpen(true);
  };

  const uploadAvatar = async (file) => {
    if (!routeClient || !session || !file) return;
    if (!AVATAR_TYPES.has(file.type)) {
      setProfileMessage("Use uma imagem JPG, PNG, WEBP ou GIF.");
      return;
    }
    if (file.size > AVATAR_MAX_SIZE) {
      setProfileMessage("A foto precisa ter no maximo 2 MB.");
      return;
    }

    setProfileUploading(true);
    setProfileMessage("Enviando foto...");
    const extension = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 6) || "jpg";
    const path = `${session.user.id}/avatar-${Date.now()}.${extension}`;
    const { error } = await routeClient.storage
      .from(AVATAR_BUCKET)
      .upload(path, file, { cacheControl: "3600", contentType: file.type, upsert: false });

    setProfileUploading(false);
    if (error) {
      console.warn("Avatar upload failed", error);
      const details = `${error.message || ""} ${error.code || ""} ${error.statusCode || ""}`.toLowerCase();
      if (details.includes("bucket") || details.includes("nosuchbucket")) {
        setProfileMessage("Bucket avatars nao existe. Rode supabase/storage-avatar.sql no Supabase.");
      } else if (details.includes("row-level") || details.includes("policy") || details.includes("rls")) {
        setProfileMessage("Permissao do bucket bloqueou o upload. Rode supabase/storage-avatar.sql no Supabase.");
      } else {
        setProfileMessage(`Falha ao enviar foto: ${error.message || "verifique o Storage do Supabase"}`);
      }
      return;
    }

    const { data } = routeClient.storage.from(AVATAR_BUCKET).getPublicUrl(path);
    setProfileForm((current) => ({ ...current, avatar_url: data.publicUrl || "" }));
    setProfileMessage("Foto enviada. Salve o perfil para confirmar.");
  };

  const saveProfile = async (e) => {
    if (e && e.preventDefault) e.preventDefault();
    if (!routeClient || !session) return;

    setProfileSaving(true);
    setProfileMessage("");
    const { data, error } = await routeClient.rpc("update_own_profile", {
      p_display_name: profileForm.display_name,
      p_avatar_url: profileForm.avatar_url,
      p_bio: profileForm.bio,
      p_share_public: profileForm.share_public,
    });

    setProfileSaving(false);
    if (error) {
      setProfileMessage("Rode o schema atualizado no Supabase antes de salvar o perfil.");
      return;
    }

    const saved = Array.isArray(data) ? data[0] : data;
    const next = { ...profileFromSession(session), ...(saved || profileForm) };
    setProfile(next);
    setProfileForm(profileToForm(next, session));
    setProfileMessage("Perfil salvo.");
  };

  const dismissPwaNudge = () => {
    setPwaNudgeOpen(false);
    setPwaNudgeDismissed(true);
    try { sessionStorage.setItem(PWA_NUDGE_SESSION_KEY, "1"); } catch (_) {}
  };

  const openPwaNudge = () => {
    if (pwaInstalled) return;
    setPwaNudgeDismissed(false);
    try { sessionStorage.removeItem(PWA_NUDGE_SESSION_KEY); } catch (_) {}
    setPwaNudgeOpen(true);
  };

  const installPwa = async () => {
    if (!installPrompt) {
      openPwaNudge();
      return;
    }
    installPrompt.prompt();
    try {
      const choice = await installPrompt.userChoice;
      if (choice?.outcome === "accepted") setPwaInstalled(true);
    } catch (_) {}
    setInstallPrompt(null);
    setCanInstallPwa(false);
    dismissPwaNudge();
  };

  const signOut = async () => {
    if (!routeClient) return;
    await routeClient.auth.signOut();
    setSession(null);
    setGuestMode(false);
    setAuthPassword("");
    setProfile(null);
    setProfileOpen(false);
    setProfileUploading(false);
    setPurchaseOpen(false);
    setPurchaseMessage("");
    setPixPayment(null);
    premiumPromptedRef.current = "";
    setSyncState("modo local");
  };

  const lvl = FILTER_LEVEL[filter];
  const visibleOf = (b) => b.items.filter((it) => FILTER_LEVEL[it.m] <= lvl);

  const stats = useMemo(() => {
    const per = {}; let totV = 0, doneV = 0, essT = 0, essD = 0;
    routeBranches.forEach((b) => {
      const vis = visibleOf(b);
      const done = vis.filter((it) => watched.has(it.id)).length;
      per[b.id] = { total: vis.length, done };
      totV += vis.length; doneV += done;
      b.items.forEach((it) => { if (it.m === M.E) { essT++; if (watched.has(it.id)) essD++; } });
    });
    return { per, totV, doneV, essT, essD };
  }, [watched, filter, routeBranches]);

  const chrono = useMemo(() => {
    const all = [];
    routeBranches.forEach((b) => visibleOf(b).forEach((it) => all.push({ ...it, branch: b })));
    all.sort((a, z) => a.cy - z.cy);
    return all;
  }, [filter, routeBranches]);

  const branchFrac = (id) => {
    const b = routeBranches.find((x) => x.id === id);
    if (!b) return 0;
    const done = b.items.filter((it) => watched.has(it.id)).length;
    return b.items.length ? done / b.items.length : 0;
  };

  const scrollTo = (id) => { const el = sectionRefs.current[id]; if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); };

  const essDone = stats.essT ? stats.essD / stats.essT : 0;
  const doomReady = stats.essD >= stats.essT && stats.essT > 0;
  const eraLabel = (cy) => (cy < 2000 ? `${Math.floor(cy)}` : `~${Math.floor(cy)}`);
  const pwaInstallModal = pwaNudgeOpen && !pwaInstalled && !purchaseOpen && !profileOpen && !posterPreview ? (
    <PwaInstallModal
      canInstall={canInstallPwa}
      onInstall={installPwa}
      onContinue={dismissPwaNudge}
      onClose={dismissPwaNudge}
    />
  ) : null;

  if (routeClient && (!authReady || (!session && !guestMode))) {
    return (
      <>
        <LoginScreen
          email={authEmail}
          password={authPassword}
          message={authMessage}
          syncState={!authReady ? "verificando sessao" : syncState}
          loading={authLoading || !authReady}
          posters={posters}
          showInstallPrompt={!pwaInstalled}
          canInstallPwa={canInstallPwa}
          onInstallPwa={installPwa}
          onOpenInstallGuide={openPwaNudge}
          onEmail={setAuthEmail}
          onPassword={setAuthPassword}
          onSignIn={signIn}
          onSignUp={signUp}
          onGoogle={signInWithGoogle}
          onLifetime={showLifetimeAccess}
          onGuest={() => { setGuestMode(true); setAuthMessage(""); }}
        />
        {pwaInstallModal}
      </>
    );
  }

  return (
    <div style={{ background: C.void, color: C.text, minHeight: "100vh", position: "relative", overflow: "hidden" }}>
      <style>{`
        .osw { font-family: 'Oswald', system-ui, sans-serif; }
        .inr { font-family: 'Inter', system-ui, sans-serif; }
        @keyframes twinkle { 0%,100% { opacity: var(--o); } 50% { opacity: calc(var(--o) * .25); } }
        @keyframes pulseGlow { 0%,100% { filter: drop-shadow(0 0 8px currentColor); } 50% { filter: drop-shadow(0 0 20px currentColor); } }
        .card-item { transition: transform .15s; }
        .card-item:active { transform: scale(.985); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
      `}</style>

      <div aria-hidden style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 0 }}>
        <div style={{ position: "absolute", inset: 0,
          background: `radial-gradient(60% 42% at 50% -6%, #E5484D2E, transparent 62%),
                       radial-gradient(48% 36% at 88% 34%, #8B7BFF1F, transparent 60%),
                       radial-gradient(52% 40% at 6% 68%, #2DD4BF17, transparent 60%),
                       radial-gradient(50% 40% at 55% 104%, #34D3991C, transparent 62%)` }} />
        {STARS.map((st, i) => (
          <span key={i} style={{ position: "absolute", left: `${st.x}%`, top: `${st.y}%`,
            width: st.s, height: st.s, borderRadius: 4, background: st.c,
            boxShadow: st.s > 2 ? `0 0 4px ${st.c}` : "none",
            "--o": st.o, opacity: st.o, animation: `twinkle ${st.d}s ease-in-out infinite` }} />
        ))}
        <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 220, opacity: 0.10,
          backgroundImage: "radial-gradient(#fff 1px, transparent 1.4px)", backgroundSize: "11px 11px",
          maskImage: "linear-gradient(#000, transparent)", WebkitMaskImage: "linear-gradient(#000, transparent)" }} />
      </div>

      <CosmicField />

      <div className="inr" style={{ maxWidth: 720, margin: "0 auto", padding: "22px 16px 64px", position: "relative", zIndex: 1 }}>

        <header style={{ marginBottom: 18, textAlign: "center" }}>
          <div className="osw" style={{ fontSize: 12, letterSpacing: 5, color: C.gold, textTransform: "uppercase" }}>
            Rota até o fim do multiverso
          </div>
          <h1 className="osw" style={{ fontSize: 44, lineHeight: 0.98, margin: "8px 0 4px", fontWeight: 700,
            letterSpacing: 1, textTransform: "uppercase",
            background: `linear-gradient(180deg, ${C.text}, #C9C2E5 55%, ${C.mcu})`,
            WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
            filter: "drop-shadow(0 4px 18px #E5484D44)" }}>
            Vingadores<br/>Doomsday
          </h1>
          <div style={{ color: C.muted, fontSize: 13, marginTop: 6 }}>
            Estreia nos cinemas · <b style={{ color: C.text }}>18 de dezembro de 2026</b>
          </div>
          <Countdown />
        </header>

        {view === "arvore" && (
          <TreeMap branchFrac={branchFrac} onPick={scrollTo} doomReady={doomReady} essDone={essDone} />
        )}

        <div style={{ background: `linear-gradient(160deg, ${C.panel2}, ${C.panel})`, border: `1px solid ${C.line}`,
          borderRadius: 16, padding: 16, margin: "16px 0 10px", boxShadow: "0 10px 30px #00000055" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
            <span className="osw" style={{ fontSize: 15, letterSpacing: 1.5 }}>SEU PROGRESSO</span>
            <span style={{ fontSize: 13, color: C.muted }}>
              {stats.doneV}/{stats.totV} no modo <b style={{ color: C.text }}>{FILTERS.find(f=>f.key===filter).label}</b>
            </span>
          </div>
          <Bar frac={stats.totV ? stats.doneV / stats.totV : 0} color={C.mcu} />
          {progressLocked && (
            <button type="button"
              onClick={() => requestPremiumCheckout(`Para marcar filmes e salvar progresso, ative o acesso vitalício ${LIFETIME_PRICE_LABEL} no Pix.`)}
              style={{ width: "100%", marginTop: 11, padding: "10px 12px", borderRadius: 10,
                border: `1px solid ${C.gold}88`, background: `${C.gold}16`, color: C.text,
                cursor: "pointer", textAlign: "left", fontSize: 12.5, lineHeight: 1.35 }}>
              Marcações e progresso ficam liberados com o acesso vitalício {LIFETIME_PRICE_LABEL} no Pix.
            </button>
          )}
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontSize: 12.5, color: C.muted }}>
              Essenciais p/ o Doomsday: <b style={{ color: doomReady ? C.doom : C.gold }}>{stats.essD}/{stats.essT}</b>
              <span style={{ marginLeft: 8, color: routeSource === "supabase" ? C.doom : C.muted }}>
                · {routeSource === "supabase" ? "Supabase" : "local"}
              </span>
            </span>
            <span style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap", justifyContent: "flex-end" }}>
              {!pwaInstalled && (
                <button type="button" onClick={canInstallPwa ? installPwa : openPwaNudge}
                  style={{ display: "flex", alignItems: "center", gap: 5, background: `${C.doom}18`,
                    border: `1px solid ${C.doom}77`, color: C.text, fontSize: 12, padding: "5px 10px",
                    borderRadius: 8, cursor: "pointer" }}>
                  <I.download /> Instalar
                </button>
              )}
              <button onClick={resetAll}
                style={{ display: "flex", alignItems: "center", gap: 5, background: "transparent",
                  border: `1px solid ${C.line}`, color: C.muted, fontSize: 12, padding: "5px 10px",
                  borderRadius: 8, cursor: "pointer" }}>
                <I.reset /> Zerar
              </button>
            </span>
          </div>
          <AuthBox
            enabled={!!routeClient}
            session={session}
            profile={profile}
            syncState={syncState}
            onSignOut={signOut}
            onOpenLogin={() => { setGuestMode(false); setAuthMessage(""); }}
            onEditProfile={openProfile}
            onBuyLifetime={openPurchase}
          />
        </div>

        <div style={{ display: "flex", gap: 6, background: C.panel, border: `1px solid ${C.line}`,
          borderRadius: 12, padding: 5, marginBottom: 8 }}>
          {[
            { k: "arvore", label: "Árvore por universo", Ic: I.branch },
            { k: "crono", label: "Cronológica", Ic: I.clock },
          ].map(({ k, label, Ic }) => {
            const on = view === k;
            return (
              <button key={k} onClick={() => setView(k)} className="osw"
                style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 7,
                  padding: "10px 4px", borderRadius: 8, border: "none", cursor: "pointer",
                  background: on ? `linear-gradient(135deg, ${C.spider}, #6A58E8)` : "transparent",
                  color: on ? "#fff" : C.muted, fontWeight: 600, fontSize: 13 }}>
                <Ic /> {label}
              </button>
            );
          })}
        </div>

        <div style={{ display: "flex", gap: 6, background: C.panel, border: `1px solid ${C.line}`,
          borderRadius: 12, padding: 5, marginBottom: 6 }}>
          {FILTERS.map((f) => {
            const on = filter === f.key;
            return (
              <button key={f.key} onClick={() => setFilter(f.key)} className="osw"
                style={{ flex: 1, padding: "9px 4px", borderRadius: 8, border: "none", cursor: "pointer",
                  background: on ? C.mcu : "transparent", color: on ? "#fff" : C.muted,
                  fontWeight: 600, fontSize: 13.5 }}>
                {f.label}
              </button>
            );
          })}
        </div>
        <p style={{ fontSize: 12, color: C.muted, margin: "0 0 20px", paddingLeft: 4 }}>
          {FILTERS.find((f) => f.key === filter).desc}.
          {view === "crono" && " Ordem aproximada em que as histórias acontecem — não a ordem de lançamento."}
        </p>

        {view === "crono" && (
          <div style={{ position: "relative", paddingLeft: 4 }}>
            <div style={{ position: "absolute", left: 21, top: 8, bottom: 8, width: 2,
              background: `linear-gradient(${C.gold}, ${C.mcu}, ${C.doom})` }} />
            {chrono.map((it, idx) => {
              const done = watched.has(it.id);
              const isExp = expanded === it.id;
              const b = it.branch;
              const prev = chrono[idx - 1];
              const newEra = !prev || Math.floor(prev.cy) !== Math.floor(it.cy);
              return (
                <React.Fragment key={it.id}>
                  {newEra && (
                    <div className="osw" style={{ margin: "14px 0 4px 40px",
                      fontSize: 12, letterSpacing: 2, color: C.gold, display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ width: 20, height: 1, background: C.gold, opacity: .6 }} />
                      {eraLabel(it.cy)}
                    </div>
                  )}
                  <div className="card-item"
                    style={{ position: "relative", display: "flex", gap: 12, alignItems: "flex-start",
                      padding: "7px 12px 7px 0" }}>
                    <span onClick={(e) => { e.stopPropagation(); toggle(it.id); }}
                      style={{ position: "relative", zIndex: 1, marginLeft: 12, marginTop: 20, cursor: progressLocked ? "not-allowed" : "pointer",
                      width: 20, height: 20, borderRadius: 20, flexShrink: 0,
                      display: "flex", alignItems: "center", justifyContent: "center",
                      background: done ? b.color : C.panel2,
                      border: `2px solid ${done ? b.color : C.line}`,
                      boxShadow: done ? `0 0 10px ${b.color}99` : "none" }}>
                      {done && <I.check />}
                    </span>
                    <div onClick={() => toggleExpand(it.id)}
                      style={{ flex: 1, minWidth: 0, cursor: "pointer",
                      background: done && !isExp ? "transparent" : `linear-gradient(150deg, ${C.panel2}, ${C.panel})`,
                      border: `1px solid ${isExp ? b.color + "77" : (done ? "transparent" : C.line)}`,
                      borderLeft: `3px solid ${b.color}`,
                      borderRadius: 10, padding: "7px 11px", opacity: done && !isExp ? 0.5 : 1,
                      boxShadow: isExp ? `0 0 18px ${b.color}22` : "none" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                      <Cover branch={b} it={it} posters={posters} onPreview={setPosterPreview} />
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                          <span className="osw" style={{ fontSize: 11, color: C.muted, fontVariantNumeric: "tabular-nums" }}>
                            {String(idx + 1).padStart(2, "0")}
                          </span>
                          {it.tv ? <I.tv /> : <I.film />}
                          <span style={{ fontSize: 14, fontWeight: 500, textDecoration: done ? "line-through" : "none" }}>{it.t}</span>
                          {it.m === M.E && <I.star />}
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 3, flexWrap: "wrap" }}>
                          <span style={{ fontSize: 10.5, color: b.color, fontWeight: 600, letterSpacing: .5,
                            border: `1px solid ${b.color}55`, borderRadius: 5, padding: "1px 6px" }}>
                            {b.title.split("(")[0].trim()}
                          </span>
                          <span style={{ fontSize: 11.5, color: C.muted }}>lançado em {it.y}</span>
                          {it.note && <span style={{ fontSize: 11.5, color: b.color, fontStyle: "italic" }}>· {it.note}</span>}
                        </div>
                      </div>
                      <I.chev style={{ transform: isExp ? "rotate(180deg)" : "none", transition: "transform .2s", flexShrink: 0, opacity: .6 }} />
                      </div>
                      <Why it={it} color={b.color} open={isExp} />
                    </div>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
        )}

        {view === "arvore" && routeBranches.map((b) => {
          const vis = visibleOf(b);
          if (!vis.length) return null;
          const st = stats.per[b.id];
          const isOpen = open[b.id];
          return (
            <section key={b.id} ref={(el) => (sectionRefs.current[b.id] = el)}
              style={{ marginBottom: 14, scrollMarginTop: 12 }}>
              <button onClick={() => setOpen((o) => ({ ...o, [b.id]: !o[b.id] }))}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 12,
                  background: `linear-gradient(135deg, ${b.color}1E, ${C.panel} 45%)`,
                  border: `1px solid ${C.line}`, borderLeft: `4px solid ${b.color}`,
                  borderRadius: 12, padding: "12px 14px", cursor: "pointer", textAlign: "left", color: C.text }}>
                <Emblem kind={b.emblem} color={b.color} />
                <span style={{ flex: 1 }}>
                  <span className="osw" style={{ display: "block", fontSize: 16.5, fontWeight: 600, letterSpacing: 0.3 }}>{b.title}</span>
                  <span style={{ display: "block", fontSize: 11.5, color: C.muted, marginTop: 1 }}>{b.sub}</span>
                </span>
                <span style={{ fontSize: 12.5, color: C.muted, fontVariantNumeric: "tabular-nums" }}>{st.done}/{st.total}</span>
                <I.chev style={{ transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .2s", flexShrink: 0 }} />
              </button>

              {isOpen && (
                <div style={{ position: "relative", marginTop: 8, paddingLeft: 4 }}>
                  <div style={{ position: "absolute", left: 21, top: 8, bottom: 26, width: 2,
                    background: b.dashed
                      ? `repeating-linear-gradient(${b.color}, ${b.color} 4px, transparent 4px, transparent 8px)`
                      : `linear-gradient(${b.color}, ${b.color}55)` }} />
                  {vis.map((it, idx) => {
                    const done = watched.has(it.id);
                    const isExp = expanded === it.id;
                    return (
                      <div key={it.id} className="card-item"
                        style={{ position: "relative", display: "flex", gap: 12, alignItems: "flex-start",
                          padding: "8px 12px 8px 0" }}>
                        <span onClick={(e) => { e.stopPropagation(); toggle(it.id); }}
                          style={{ position: "relative", zIndex: 1, marginLeft: 12, marginTop: 20, cursor: progressLocked ? "not-allowed" : "pointer",
                          width: 20, height: 20, borderRadius: 20, flexShrink: 0,
                          display: "flex", alignItems: "center", justifyContent: "center",
                          background: done ? b.color : C.panel2,
                          border: `2px solid ${done ? b.color : C.line}`,
                          boxShadow: done ? `0 0 8px ${b.color}88` : "none" }}>
                          {done && <I.check />}
                        </span>
                        <div onClick={() => toggleExpand(it.id)}
                          style={{ flex: 1, minWidth: 0, cursor: "pointer",
                          background: done && !isExp ? "transparent" : `linear-gradient(150deg, ${C.panel2}, ${C.panel})`,
                          border: `1px solid ${isExp ? b.color + "77" : (done ? "transparent" : C.line)}`,
                          borderRadius: 10, padding: "7px 11px", opacity: done && !isExp ? 0.55 : 1,
                          boxShadow: isExp ? `0 0 18px ${b.color}22` : "none" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                          <Cover branch={b} it={it} posters={posters} onPreview={setPosterPreview} />
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
                              <span className="osw" style={{ fontSize: 11, color: C.muted, fontVariantNumeric: "tabular-nums", flexShrink: 0 }}>
                                {String(idx + 1).padStart(2, "0")}
                              </span>
                              {it.tv ? <I.tv /> : <I.film />}
                              <span style={{ fontSize: 14, fontWeight: 500, textDecoration: done ? "line-through" : "none" }}>{it.t}</span>
                              {it.m === M.E && <I.star />}
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 3, flexWrap: "wrap" }}>
                              <span style={{ fontSize: 11.5, color: C.muted }}>{it.y} · história em {eraLabel(it.cy)}</span>
                              {it.note && <span style={{ fontSize: 11.5, color: b.color, fontStyle: "italic" }}>· {it.note}</span>}
                            </div>
                          </div>
                          <I.chev style={{ transform: isExp ? "rotate(180deg)" : "none", transition: "transform .2s", flexShrink: 0, opacity: .6 }} />
                          </div>
                          <Why it={it} color={b.color} open={isExp} />
                        </div>
                      </div>
                    );
                  })}
                  {b.merge && (
                    <div style={{ marginLeft: 33, marginTop: 2, display: "flex", alignItems: "center", gap: 6,
                      fontSize: 11.5, color: b.color }}>
                      <span style={{ fontSize: 14 }}>⤵</span> {b.merge}
                    </div>
                  )}
                </div>
              )}
            </section>
          );
        })}

        <div style={{ marginTop: 22, position: "relative", borderRadius: 18, overflow: "hidden",
          border: `1px solid ${doomReady ? C.doom : C.line}`,
          background: doomReady
            ? `radial-gradient(120% 120% at 50% 0%, ${C.doom}26, ${C.panel} 60%)`
            : `radial-gradient(120% 120% at 50% 0%, ${C.mcu}18, ${C.panel} 60%)`,
          boxShadow: doomReady ? `0 0 34px ${C.doom}44` : "0 10px 30px #00000055" }}>
          <div aria-hidden style={{ position: "absolute", inset: 0, opacity: .07,
            backgroundImage: "radial-gradient(#fff 1px, transparent 1.4px)", backgroundSize: "10px 10px" }} />
          <div style={{ padding: "22px 18px", textAlign: "center", position: "relative" }}>
            <I.zap size={24} color={doomReady ? C.doom : C.gold} style={{ animation: "pulseGlow 2.6s ease-in-out infinite", color: doomReady ? C.doom : C.gold }} />
            <div className="osw" style={{ fontSize: 12, letterSpacing: 3, color: C.gold, textTransform: "uppercase", marginTop: 6 }}>
              A convergência
            </div>
            <div className="osw" style={{ fontSize: 27, fontWeight: 700, margin: "2px 0 6px", letterSpacing: 1 }}>
              VINGADORES: DOOMSDAY
            </div>
            <p style={{ fontSize: 13, color: C.muted, margin: "0 auto 12px", maxWidth: 390 }}>
              Três universos colidem: Vingadores, Novos Vingadores, Quarteto Fantástico,
              os Wakandanos e os X‑Men originais — contra o Doutor Destino.
            </p>
            <div style={{ maxWidth: 320, margin: "0 auto" }}>
              <Bar frac={essDone} color={doomReady ? C.doom : C.gold} />
            </div>
            <div style={{ fontSize: 12.5, color: doomReady ? C.doom : C.muted, marginTop: 8, fontWeight: 600 }}>
              {doomReady ? "✓ Essenciais concluídos — você está pronto pra estreia"
                         : `${stats.essD}/${stats.essT} essenciais assistidos`}
            </div>
          </div>
          <div style={{ borderTop: `1px dashed ${C.line}`, padding: "10px 18px", textAlign: "center",
            fontSize: 11.5, color: C.muted, position: "relative" }}>
            e a saga fecha em <b style={{ color: C.text }}>Vingadores: Secret Wars</b> · 17 · 12 · 2027
          </div>
        </div>

        <p style={{ fontSize: 11, color: C.muted, textAlign: "center", marginTop: 18, lineHeight: 1.7 }}>
          Toque no card pra ver por que aquele título importa · toque na bolinha pra marcar como assistido.<br />
          ⭐ = essencial pro Doomsday · linhas tracejadas = canon frouxo · ordem cronológica é aproximada.
        </p>
      </div>

      {posterPreview && (
        <div role="dialog" aria-modal="true" aria-label={`Capa de ${posterPreview.t}`}
          onClick={() => setPosterPreview(null)}
          style={{ position: "fixed", inset: 0, zIndex: 20, display: "flex", alignItems: "center",
            justifyContent: "center", padding: 18, background: "#05030CCC", backdropFilter: "blur(10px)" }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ width: "min(88vw, 380px)", position: "relative", borderRadius: 14, overflow: "hidden",
              background: `linear-gradient(180deg, ${posterPreview.color}22, ${C.panel} 72%)`,
              border: `1px solid ${posterPreview.color}88`, boxShadow: `0 18px 70px #000000AA, 0 0 28px ${posterPreview.color}33` }}>
            <button type="button" onClick={() => setPosterPreview(null)} aria-label="Fechar capa"
              style={{ position: "absolute", top: 10, right: 10, zIndex: 1, width: 36, height: 36,
                display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 999,
                border: `1px solid ${C.text}33`, background: "#070510CC", color: C.text, cursor: "pointer" }}>
              <I.close />
            </button>
            <img src={`https://image.tmdb.org/t/p/w500${posterPreview.poster}`} alt={`Capa de ${posterPreview.t}`}
              style={{ width: "100%", aspectRatio: "2 / 3", display: "block", objectFit: "cover", background: C.panel2 }} />
            <div style={{ padding: "13px 15px 15px" }}>
              <div className="osw" style={{ fontSize: 20, lineHeight: 1.15, fontWeight: 700 }}>{posterPreview.t}</div>
              <div style={{ marginTop: 4, color: C.muted, fontSize: 12 }}>{posterPreview.y} · {posterPreview.branch}</div>
            </div>
          </div>
        </div>
      )}

      {profileOpen && session && (
        <ProfileModal
          form={profileForm}
          message={profileMessage}
          saving={profileSaving}
          uploadingAvatar={profileUploading}
          onChange={changeProfileField}
          onAvatarFile={uploadAvatar}
          onSave={saveProfile}
          onClose={() => setProfileOpen(false)}
        />
      )}

      {purchaseOpen && session && (
        <PixPaymentModal
          form={purchaseForm}
          pix={pixPayment}
          message={purchaseMessage}
          loading={purchaseLoading}
          isPremium={!!profile?.premium_lifetime}
          onChange={changePurchaseField}
          onCreate={createPixPayment}
          onCopy={copyPixPayload}
          onCheck={checkPixPayment}
          onClose={() => setPurchaseOpen(false)}
        />
      )}

      {pwaInstallModal}
    </div>
  );
}

function TreeMap({ branchFrac, onPick, doomReady, essDone }) {
  const trunkX = 192;
  const node = (id, x, y, label, color, sub, big) => {
    const frac = id === "doomsday" ? essDone : branchFrac(id);
    const r = big ? 15 : 9;
    return (
      <g key={id} style={{ cursor: "pointer" }} onClick={() => id !== "doomsday" && onPick(id)}>
        <circle cx={x} cy={y} r={r + 12} fill="transparent" />
        <Ring cx={x} cy={y} r={r + 4} frac={frac} color={color} w={big ? 4 : 3} />
        <circle cx={x} cy={y} r={r} fill={color} style={{ filter: `drop-shadow(0 0 ${big ? 10 : 5}px ${color})` }} />
        {big && <text x={x} y={y + 4} textAnchor="middle" fontSize="12" fontWeight="700" fill="#070510" className="osw">DD</text>}
        <text x={x} y={y - r - 9} textAnchor="middle" fontSize="10.5" fontWeight="600" fill={C.text} className="osw">{label}</text>
        {sub && <text x={x} y={y + r + 15} textAnchor="middle" fontSize="8.5" fill={C.muted}>{sub}</text>}
      </g>
    );
  };
  return (
    <div style={{ background: `linear-gradient(180deg, ${C.panel2}, ${C.panel})`, border: `1px solid ${C.line}`,
      borderRadius: 16, padding: "8px 4px 4px", boxShadow: "0 10px 30px #00000055" }}>
      <div className="osw" style={{ fontSize: 12, letterSpacing: 2, color: C.muted, padding: "6px 12px 0" }}>
        MAPA DAS CONFLUÊNCIAS · toque num galho pra pular até ele
      </div>
      <svg viewBox="0 0 384 500" style={{ width: "100%", height: "auto", display: "block" }}>
        <defs>
          <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor={C.mcu} /><stop offset="1" stopColor={C.gold} />
          </linearGradient>
        </defs>
        <path d={`M ${trunkX} 60 L ${trunkX} 430`} stroke="url(#trunk)" strokeWidth="5" fill="none" strokeLinecap="round" />
        <path d={`M ${trunkX} 430 L ${trunkX} 476`} stroke={C.line} strokeWidth="3" strokeDasharray="4 6" fill="none" />
        <path d={`M 96 150 C 140 150, 150 175, ${trunkX} 185`} stroke={C.series} strokeWidth="2.5" fill="none" opacity="0.8" />
        <path d={`M 74 250 C 120 250, 140 240, ${trunkX} 238`} stroke={C.spider} strokeWidth="2.5" fill="none" opacity="0.8" />
        <path d={`M 74 315 C 120 315, 140 305, ${trunkX} 300`} stroke={C.xmen} strokeWidth="2.5" fill="none" opacity="0.8" />
        <path d={`M 310 215 C 265 215, 250 225, ${trunkX} 238`} stroke={C.extra} strokeWidth="2" strokeDasharray="3 5" fill="none" opacity="0.7" />
        <path d={`M 310 355 C 265 355, 250 350, ${trunkX} 350`} stroke={C.extra} strokeWidth="2" strokeDasharray="3 5" fill="none" opacity="0.7" />
        <circle cx={trunkX} cy={185} r="3.5" fill={C.series} />
        <circle cx={trunkX} cy={238} r="3.5" fill={C.spider} />
        <circle cx={trunkX} cy={300} r="3.5" fill={C.xmen} />
        <circle cx={trunkX} cy={350} r="3.5" fill={C.gold} />
        {node("infinito", trunkX, 74, "Saga do Infinito", C.mcu, "Fases 1–3")}
        {node("multiverso", trunkX, 150, "Saga do Multiverso", C.mcu, "Fases 4–6")}
        <text x={trunkX + 10} y={188} fontSize="8.5" fill={C.muted}>Sem Volta pra Casa</text>
        <text x={trunkX + 10} y={241} fontSize="8.5" fill={C.muted}>Deadpool & Wolverine</text>
        <text x={trunkX + 10} y={303} fontSize="8.5" fill={C.muted}>Novos Vingadores</text>
        <text x={trunkX + 10} y={353} fontSize="8.5" fill={C.muted}>QF: Primeiros Passos</text>
        {node("series", 96, 150, "Séries D+", C.series, "MCU")}
        {node("spider", 74, 250, "Aranhas alt.", C.spider, "Raimi/Webb")}
        {node("xmen", 74, 315, "X-Men Fox", C.xmen, "+Deadpool")}
        {node("sony", 310, 215, "Sony", C.extra, "Venom…")}
        {node("qf", 310, 355, "QF antigos", C.extra, "Fox")}
        {node("doomsday", trunkX, 415, "DOOMSDAY", doomReady ? C.doom : C.gold, "18·12·2026", true)}
        <text x={trunkX} y={492} textAnchor="middle" fontSize="8.5" fill={C.muted}>Secret Wars · 2027</text>
      </svg>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/pwa-sw.js").catch(() => {});
  });
}
</script>
