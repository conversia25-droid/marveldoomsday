server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # garante charset correto (evita acentos quebrados)
    charset utf-8;

    # manifest com o tipo certo, senão o iOS/Android ignora
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache dos ícones, sem cache do html
    location ~* \.(png|ico|svg)$ {
        expires 30d;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/manifest+json;
}
