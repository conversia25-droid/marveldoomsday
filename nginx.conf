server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # manifest com o tipo certo, senão o iOS/Android ignora
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /pwa-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }

    # ícones podem ser cacheados à vontade
    location ~* \.(png|ico|svg)$ {
        expires 30d;
    }

    # o HTML nunca fica em cache — corrige "/" e "/index.html"
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        etag off;
    }

    gzip on;
    gzip_types text/css application/javascript application/manifest+json;
}
